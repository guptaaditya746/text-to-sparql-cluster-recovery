services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-admin}
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend-init:
    build:
      context: ./gen2kgbot
    user: root
    command: /bin/bash -lc "/opt/conda/envs/gen2kgbot/bin/python -m setup_db.init_db && chown -R mambauser:mambauser /app/data"
    environment:
      MONGODB_CONNECTION_STRING: ${MONGODB_CONNECTION_STRING:-mongodb://admin:admin@mongodb:27017/?authSource=admin}
      Q2FORGE_SECRET_KEY: ${Q2FORGE_SECRET_KEY:-d7655ea104320f61fc49ac859501609b9595b994472d473ad736dc0ec657d512}

      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-llama3.2:1b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text:latest}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text:latest}

    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend-data:/app/data
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./gen2kgbot
    restart: unless-stopped
    environment:
      MONGODB_CONNECTION_STRING: ${MONGODB_CONNECTION_STRING:-mongodb://admin:admin@mongodb:27017/?authSource=admin}
      Q2FORGE_SECRET_KEY: ${Q2FORGE_SECRET_KEY:-d7655ea104320f61fc49ac859501609b9595b994472d473ad736dc0ec657d512}

      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-llama3.2:1b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text:latest}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text:latest}

      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OVHCLOUD_API_KEY: ${OVHCLOUD_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}

    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8003}:8000"
    volumes:
      - backend-data:/app/data
    depends_on:
      backend-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/q2forge/openapi.json', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./q2forge
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
  mongodb-data:
