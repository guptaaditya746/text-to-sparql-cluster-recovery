# KG full name (used in prompts)
kg_full_name: DBLP Computer Science Bibliography Knowledge Graph

# KG short name (used to generate file paths)
kg_short_name: dblp

# KG textual description (used in prompts)
kg_description: >
  The DBLP Knowledge Graph is the RDF representation of the dblp computer science
  bibliography. It models scholarly publications, creators, publication venues
  called streams, signatures linking publications to authors or editors, external
  identifiers, and bibliographic metadata such as titles, years, pages, volumes,
  DOIs, ORCIDs, ISBNs, ISSNs, Wikidata IDs, and OpenCitations Meta Identifiers
  (OMIDs). Use dblp:Publication and its subtypes for papers and books, dblp:Creator
  and its subtypes for authors and editors, dblp:Stream and its subtypes for
  journals, conference/workshop series, repositories, and book series. Prefer
  direct predicates such as dblp:authoredBy, dblp:authorOf, dblp:publishedInStream,
  dblp:yearOfPublication, and dblp:title for common bibliography questions.
  Use dblp:hasSignature with dblp:signatureCreator, dblp:signatureDblpName,
  dblp:signatureOrdinal, and dblp:signatureOrcid when author order, role, or
  publication-specific creator metadata matters. Venue lookup should prefer
  dblp:publishedInStream and stream titles, while legacy literal venue names may
  use dblp:publishedIn, dblp:publishedInJournal, or dblp:publishedInSeries.
  Citation-style queries are supported through OpenCitations data in the public
  endpoint by joining DBLP publications through dblp:omid to CiTO citation
  entities, especially cito:hasCitedEntity and cito:hasCitingEntity. Affiliation
  values exist as literals on creators via dblp:affiliation and
  dblp:primaryAffiliation; they are not modeled as institution entities.

# SPARQL endpoint serving the KG
kg_sparql_endpoint_url: "https://sparql.dblp.org/sparql"

# SPARQL endpoint serving the DBLP RDF schema
ontologies_sparql_endpoint_url: "https://sparql.dblp.org/sparql"

# Prefixes and namespaces to be used in Turtle and SPARQL queries
prefixes:
  dblp: "https://dblp.org/rdf/schema#"
  rdf: "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
  rdfs: "http://www.w3.org/2000/01/rdf-schema#"
  xsd: "http://www.w3.org/2001/XMLSchema#"
  owl: "http://www.w3.org/2002/07/owl#"
  datacite: "http://purl.org/spar/datacite/"
  litre: "http://purl.org/spar/literal/"
  cito: "http://purl.org/spar/cito/"
  bibtex: "http://purl.org/net/nknouf/ns/bibtex#"
  bibo: "http://purl.org/ontology/bibo/"
  dct: "http://purl.org/dc/terms/"
  dc: "http://purl.org/dc/elements/1.1/"
  foaf: "http://xmlns.com/foaf/0.1/"
  schema: "https://schema.org/"
  wd: "http://www.wikidata.org/entity/"
  wdt: "http://www.wikidata.org/prop/direct/"

# DBLP exposes its schema in the default graph of the public endpoint.
ontology_named_graphs: []

# Properties used to extract context for QNames in generated SPARQL queries
properties_qnames_info:
