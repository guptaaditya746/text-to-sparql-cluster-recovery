  - rdfs:comment
  - dblp:title
  - dblp:bibtexType
  - dblp:yearOfPublication
  - dblp:yearOfEvent
  - dblp:monthOfPublication
  - dblp:numberOfCreators
  - dblp:pagination
  - dblp:publicationNote
  - dblp:createdBy
  - dblp:creatorOf
  - dblp:authoredBy
  - dblp:authorOf
  - dblp:editedBy
  - dblp:editorOf
  - dblp:coCreatorWith
  - dblp:coAuthorWith
  - dblp:coEditorWith
  - dblp:creatorName
  - dblp:primaryCreatorName
  - dblp:hasSignature
  - dblp:signaturePublication
  - dblp:signatureCreator
  - dblp:signatureDblpName
  - dblp:signatureOrdinal
  - dblp:signatureOrcid
  - dblp:publishedInStream
  - dblp:publishedIn
  - dblp:publishedInJournal
  - dblp:publishedInJournalVolume
  - dblp:publishedInSeries
  - dblp:publishedInSeriesVolume
  - dblp:publishedAsPartOf
  - dblp:primaryStreamTitle
  - dblp:streamTitle
  - dblp:formerStreamTitle
  - dblp:relatedStream
  - dblp:subStream
  - dblp:superStream
  - dblp:predecessorStream
  - dblp:successorStream
  - dblp:indexPage
  - dblp:iso4
  - dblp:identifier
  - dblp:doi
  - dblp:orcid
  - dblp:omid
  - dblp:isbn
  - dblp:issn
  - dblp:wikidata
  - dblp:wikipedia
  - dblp:webpage
  - dblp:homepage
  - dblp:primaryHomepage
  - dblp:documentPage
  - dblp:primaryDocumentPage
  - datacite:hasIdentifier
  - datacite:usesIdentifierScheme
  - litre:hasLiteralValue
  - schema:url
  - dblp:affiliation
  - dblp:primaryAffiliation
  - cito:hasCitedEntity
  - cito:hasCitingEntity

# Optional list of classes and namespaces to exclude from similar-class retrieval
excluded_classes_namespaces:
  - "http://www.wikidata.org/entity/"
  - "http://www.wikidata.org/prop/direct/"
  - "https://schema.org/"
  - "http://dbpedia.org/ontology/"
  - "http://xmlns.com/foaf/0.1/"
  - "http://purl.org/ontology/bibo/"
  - "http://purl.org/net/nknouf/ns/bibtex#"
  - "http://id.loc.gov/ontologies/bibframe/"
  - "http://id.loc.gov/vocabulary/identifiers/"
  - "http://id.loc.gov/vocabulary/relators/"
  - "http://purl.org/dc/terms/"
  - "http://purl.org/dc/elements/1.1/"
  - "http://www.w3.org/2002/07/owl#"
  - "http://www.w3.org/2000/01/rdf-schema#"
  - "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
  - "http://www.w3.org/2001/XMLSchema#"

# Root path for classes context and pre-computed embeddings
data_directory: "./data"

# Embedding sub-directories
class_embeddings_subdir: "classes_with_instance_nomic"
property_embeddings_subdir: "properties_nomic"
queries_embeddings_subdir: "sparql_queries_nomic"

# Path to a usable temporary directory
temp_directory: "./tmp"

# Retrieval options
max_similar_classes: 14
expand_similar_classes: true
class_context_format: turtle

# -----------------------------------------------------------
# LLM configurations

seq2seq_models:
  qwen-chat@remote:
    server_type: openai
    id: qwen-chat
    base_url: http://gammaweb07.medien.uni-weimar.de:8000/v1
    temperature: 0
    max_retries: 3
    top_p: 0.95

text_embedding_models:
  qwen-embed_faiss@remote:
    server_type: openai-embeddings
    id: qwen-embed
    base_url: http://gammaweb07.medien.uni-weimar.de:8001/v1
    vector_db: faiss

